<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pour Soulefed ✨</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      overflow: hidden;
    }

    /* --- المشهد الأول: الفيديو والموسيقى --- */
    #scene-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000;
      transition: opacity 1s ease;
    }

    .bg-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.85;
    }

    #start-btn {
      position: relative;
      z-index: 20;
      padding: 16px 36px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #fff;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
    }

    #start-btn:hover {
      transform: scale(1.05);
      background: rgba(255, 255, 255, 0.3);
    }

    #greeting-text {
      position: absolute;
      z-index: 20;
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
      display: none;
      animation: fadeIn 0.8s ease forwards;
    }

    /* --- المشهد الثاني: عالم البنات والوردة والشاورما --- */
    #scene-flower {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      opacity: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #feada6 100%);
      transition: opacity 1.5s ease;
      padding: 20px;
      text-align: center;
    }

    .title-text {
      font-size: 2.2rem;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 2px 10px rgba(214, 51, 132, 0.4);
      margin-bottom: 15px;
      animation: bounce 2s infinite;
    }

    .click-hint {
      font-size: 0.95rem;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.15);
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 15px;
    }

    /* الوردة / الشاورما التفاعلية */
    .flower-container {
      position: relative;
      width: 180px;
      height: 180px;
      margin: 10px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    .interactive-emoji {
      font-size: 8.5rem;
      filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.15));
      animation: pulse 2s infinite ease-in-out;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .interactive-emoji:active {
      transform: scale(0.8);
    }

    .message-text {
      font-size: 1.8rem;
      font-weight: 800;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(8px);
      padding: 15px 30px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 8px 32px 0 rgba(255, 105, 180, 0.2);
      margin-top: 20px;
      transition: all 0.5s ease;
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .pop-animation {
      animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes pop {
      0% { transform: scale(0.3) rotate(-20deg); opacity: 0; }
      50% { transform: scale(1.3) rotate(10deg); }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- المشهد الأول -->
  <div id="scene-video">
    <video id="myVideo" class="bg-video" loop playsinline preload="auto">
      <source src="https://assets.mixkit.co/videos/preview/mixkit-dramatic-time-lapse-of-clouds-and-mountains-4220-large.mp4" type="video/mp4">
    </video>

    <button id="start-btn" onclick="startExperience()">✨ Cliquez ici pour commencer</button>
    <div id="greeting-text">Slm Slfd</div>
  </div>

  <audio id="bgMusic" loop preload="auto">
    <source src="https://assets.mixkit.co/music/preview/mixkit-beautiful-dream-493.mp3" type="audio/mpeg">
  </audio>

  <!-- المشهد الثاني -->
  <div id="scene-flower">
    <div class="title-text" id="main-title">haki hdi werda 🌹</div>
    <div class="click-hint" id="hint-text">👉 Cliquez sur la rose !</div>
    
    <div class="flower-container" onclick="transformToShawarma()">
      <div class="interactive-emoji" id="emoji-display">🌹</div>
    </div>

    <div class="message-text" id="sub-message">
      Tahya nti a vie slfd🫶🏼
    </div>
  </div>

  <script>
    function startExperience() {
      const startBtn = document.getElementById('start-btn');
      const video = document.getElementById('myVideo');
      const music = document.getElementById('bgMusic');
      const greeting = document.getElementById('greeting-text');
      const sceneVideo = document.getElementById('scene-video');
      const sceneFlower = document.getElementById('scene-flower');

      startBtn.style.display = 'none';
      video.play();
      music.play();

      setTimeout(() => {
        greeting.style.display = 'block';

        setTimeout(() => {
          sceneVideo.style.opacity = '0';
          
          setTimeout(() => {
            sceneVideo.style.display = 'none';
            sceneFlower.style.opacity = '1';
          }, 1000);

        }, 2000);

      }, 3000);
    }

    // ميزة الضغط على الوردة للتحول إلى شاورما
    let isShawarma = false;

    function transformToShawarma() {
      const emojiDisplay = document.getElementById('emoji-display');
      const mainTitle = document.getElementById('main-title');
      const subMessage = document.getElementById('sub-message');
      const hintText = document.getElementById('hint-text');

      // إعادة تفعيل الحركة
      emojiDisplay.classList.remove('pop-animation');
      void emojiDisplay.offsetWidth; // Trigger reflow
      emojiDisplay.classList.add('pop-animation');

      if (!isShawarma) {
        emojiDisplay.textContent = '🥙';
        mainTitle.textContent = 'Bsahtek shawirma a chaba 🌝🥙';
        subMessage.textContent = 'Shawirma Special Edition 🌯❤️';
        hintText.textContent = '✨ Clique encore pour la rose !';
        isShawarma = true;
      } else {
        emojiDisplay.textContent = '🌹';
        mainTitle.textContent = 'haki hdi werda 🌹';
        subMessage.textContent = 'Tahya nti a vie slfd🫶🏼';
        hintText.textContent = '👉 Cliquez sur la rose !';
        isShawarma = false;
      }
    }
  </script>
</body>
</html>
