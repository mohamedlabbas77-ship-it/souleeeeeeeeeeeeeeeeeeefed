<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pour Soulefed ✨</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      overflow: hidden;
    }

    /* --- المشهد الأول: الفيديو والموسيقى --- */
    #scene-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000;
      transition: opacity 1s ease;
    }

    /* فيديو الخلفية (منظر طبيعي خلاب) */
    .bg-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.85;
    }

    /* زر بدء العرض */
    #start-btn {
      position: relative;
      z-index: 20;
      padding: 16px 36px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #fff;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
    }

    #start-btn:hover {
      transform: scale(1.05);
      background: rgba(255, 255, 255, 0.3);
    }

    /* نص السلام بعد 3 ثواني */
    #greeting-text {
      position: absolute;
      z-index: 20;
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
      display: none;
      animation: fadeIn 0.8s ease forwards;
    }

    /* --- المشهد الثاني: عالم البنات والوردة --- */
    #scene-flower {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      opacity: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      /* خلفية متدرجة أنيقة تعبر عن عالم البنات */
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #feada6 100%);
      transition: opacity 1.5s ease;
      padding: 20px;
      text-align: center;
    }

    .title-text {
      font-size: 2.2rem;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 2px 10px rgba(214, 51, 132, 0.4);
      margin-bottom: 25px;
      animation: bounce 2s infinite;
    }

    /* تصميم وردة حمراء تفاعلية أنيقة */
    .flower-container {
      position: relative;
      width: 160px;
      height: 160px;
      margin: 20px 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .rose-emoji {
      font-size: 8rem;
      filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.15));
      animation: pulse 2s infinite ease-in-out;
    }

    .message-text {
      font-size: 1.8rem;
      font-weight: 800;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(8px);
      padding: 15px 30px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 8px 32px 0 rgba(255, 105, 180, 0.2);
      margin-top: 25px;
    }

    /* التأثيرات الحركية (Animations) */
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
  </style>
</head>
<body>

  <!-- المشهد الأول: فيديو المنظر الخلاب والموسيقى -->
  <div id="scene-video">
    <!-- فيديو منظر طبيعي خلاب للجبال والغيوم (طبيعة بجودة عالية) -->
    <video id="myVideo" class="bg-video" loop playsinline preload="auto">
      <source src="https://assets.mixkit.co/videos/preview/mixkit-dramatic-time-lapse-of-clouds-and-mountains-4220-large.mp4" type="video/mp4">
    </video>

    <!-- زر للبدء لتشغيل الصوت والفيديو بسلاسة -->
    <button id="start-btn" onclick="startExperience()">✨ Cliquez ici pour commencer</button>

    <!-- كلمة السَلام -->
    <div id="greeting-text">Slm Slfd</div>
  </div>

  <!-- صوت موسيقى هادئة وجميلة خلف المنظر الخلاب -->
  <audio id="bgMusic" loop preload="auto">
    <source src="https://assets.mixkit.co/music/preview/mixkit-beautiful-dream-493.mp3" type="audio/mpeg">
  </audio>

  <!-- المشهد الثاني: عالم البنات والوردة -->
  <div id="scene-flower">
    <div class="title-text">haki hdi werda 🌹</div>
    
    <div class="flower-container">
      <div class="rose-emoji">🌹</div>
    </div>

    <div class="message-text">
      Tahya nti a vie slfd🫶🏼
    </div>
  </div>

  <script>
    function startExperience() {
      const startBtn = document.getElementById('start-btn');
      const video = document.getElementById('myVideo');
      const music = document.getElementById('bgMusic');
      const greeting = document.getElementById('greeting-text');
      const sceneVideo = document.getElementById('scene-video');
      const sceneFlower = document.getElementById('scene-flower');

      // إخفاء الزر وتشغيل الفيديو والموسيقى
      startBtn.style.display = 'none';
      video.play();
      music.play();

      // بعد 3 ثواني بالضبط: يظهر نص "Slm Slfd"
      setTimeout(() => {
        greeting.style.display = 'block';

        // بعد ظهور النص بثانيتين: تنتقل الشاشة إلى عالم البنات
        setTimeout(() => {
          sceneVideo.style.opacity = '0';
          
          setTimeout(() => {
            sceneVideo.style.display = 'none';
            sceneFlower.style.opacity = '1';
          }, 1000);

        }, 2000);

      }, 3000);
    }
  </script>
</body>
</html>
